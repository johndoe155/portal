<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1080" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="High School Portal system architecture diagram">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .layer  { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.5; }
      .box    { stroke-width:1.5; }
      .title  { font-size:22px; font-weight:700; fill:#0f172a; }
      .sub    { font-size:12px; fill:#64748b; }
      .lbl    { font-size:11px; font-weight:700; fill:#475569; letter-spacing:1.4px; }
      .btitle { font-size:14px; font-weight:700; fill:#0f172a; }
      .btext  { font-size:11.5px; fill:#334155; }
      .bsmall { font-size:10.5px; fill:#64748b; }
      .edge   { stroke:#94a3b8; stroke-width:1.6; fill:none; }
      .edgeb  { stroke:#2563eb; stroke-width:1.6; fill:none; stroke-dasharray:5 4; }
      .cap    { font-size:10.5px; fill:#475569; font-weight:600; }
    </style>
  </defs>

  <rect width="1280" height="1080" fill="#ffffff"/>
  <text x="640" y="42" text-anchor="middle" class="title">High School Portal — System Architecture (Phase 1)</text>
  <text x="640" y="62" text-anchor="middle" class="sub">Two-gate authorization (CASL guards + PostgreSQL RLS) · BFF session cookies · modular monolith · v1.0 · 2026-10-01</text>

  <!-- PERSONAS -->
  <text x="80" y="100" class="lbl">PERSONAS</text>
  <g>
    <rect x="200" y="84" width="170" height="46" rx="10" fill="#eef2ff" stroke="#6366f1" class="box"/>
    <text x="285" y="106" text-anchor="middle" class="btitle">Admin</text>
    <text x="285" y="121" text-anchor="middle" class="bsmall">/admin · MFA enforced</text>

    <rect x="400" y="84" width="170" height="46" rx="10" fill="#ecfdf5" stroke="#059669" class="box"/>
    <text x="485" y="106" text-anchor="middle" class="btitle">Teacher</text>
    <text x="485" y="121" text-anchor="middle" class="bsmall">/teacher · MFA enforced</text>

    <rect x="600" y="84" width="170" height="46" rx="10" fill="#fff7ed" stroke="#ea580c" class="box"/>
    <text x="685" y="106" text-anchor="middle" class="btitle">Student</text>
    <text x="685" y="121" text-anchor="middle" class="bsmall">/student · COPPA gate</text>

    <rect x="800" y="84" width="170" height="46" rx="10" fill="#fdf2f8" stroke="#db2777" class="box"/>
    <text x="885" y="106" text-anchor="middle" class="btitle">Parent</text>
    <text x="885" y="121" text-anchor="middle" class="bsmall">/parent · read-only + chat</text>
  </g>

  <path d="M 285 130 L 285 160" class="edge" marker-end="url(#arrow)"/>
  <path d="M 485 130 L 485 160" class="edge" marker-end="url(#arrow)"/>
  <path d="M 685 130 L 685 160" class="edge" marker-end="url(#arrow)"/>
  <path d="M 885 130 L 885 160" class="edge" marker-end="url(#arrow)"/>

  <!-- EDGE -->
  <rect x="80" y="162" width="1120" height="58" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="104" y="186" class="lbl">EDGE</text>
  <text x="104" y="207" class="btext">Cloudflare — DNS · TLS 1.3 termination · WAF · bot management · rate limiting · static CDN</text>
  <text x="1176" y="197" text-anchor="end" class="bsmall">HTTPS only · HSTS preload</text>

  <path d="M 640 220 L 640 252" class="edge" marker-end="url(#arrow)"/>

  <!-- PRESENTATION -->
  <rect x="80" y="254" width="1120" height="118" rx="12" class="layer"/>
  <text x="104" y="278" class="lbl">PRESENTATION</text>
  <text x="104" y="300" class="btext" font-weight="700" fill="#0f172a">Next.js 16 — App Router · React 19.2 RSC · Tailwind v4 + shadcn/ui · TanStack Query · PWA + offline sync</text>
  <g>
    <rect x="104" y="312" width="150" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" class="box"/>
    <text x="179" y="331" text-anchor="middle" class="btext" font-weight="700">proxy.ts guard</text>
    <text x="179" y="347" text-anchor="middle" class="bsmall">role route redirect</text>

    <rect x="266" y="312" width="150" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" class="box"/>
    <text x="341" y="331" text-anchor="middle" class="btext" font-weight="700">BFF /auth</text>
    <text x="341" y="347" text-anchor="middle" class="bsmall">httpOnly cookie only</text>

    <rect x="428" y="312" width="180" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" class="box"/>
    <text x="518" y="331" text-anchor="middle" class="btext" font-weight="700">Role dashboards ×4</text>
    <text x="518" y="347" text-anchor="middle" class="bsmall">mobile-first layouts</text>

    <rect x="620" y="312" width="180" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" class="box"/>
    <text x="710" y="331" text-anchor="middle" class="btext" font-weight="700">Offline attendance</text>
    <text x="710" y="347" text-anchor="middle" class="bsmall">IndexedDB + sync queue</text>

    <rect x="812" y="312" width="180" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" class="box"/>
    <text x="902" y="331" text-anchor="middle" class="btext" font-weight="700">Web Push client</text>
    <text x="902" y="347" text-anchor="middle" class="bsmall">VAPID / FCM</text>

    <rect x="1004" y="312" width="172" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" class="box"/>
    <text x="1090" y="331" text-anchor="middle" class="btext" font-weight="700">Generated API client</text>
    <text x="1090" y="347" text-anchor="middle" class="bsmall">packages/contracts</text>
  </g>

  <path d="M 480 372 L 480 404" class="edge" marker-end="url(#arrow)"/>
  <text x="492" y="392" class="cap">REST /api/v1 (OpenAPI 3.1)</text>
  <path d="M 960 372 L 960 404" class="edgeb" marker-end="url(#arrowBlue)"/>
  <text x="972" y="392" class="cap">WSS</text>

  <!-- API -->
  <rect x="80" y="406" width="720" height="196" rx="12" class="layer"/>
  <text x="104" y="430" class="lbl">API — NESTJS 12 MODULAR MONOLITH</text>
  <rect x="104" y="442" width="672" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" class="box"/>
  <text x="440" y="459" text-anchor="middle" class="btext" font-weight="700" fill="#991b1b">GATE 1 — SessionGuard → RolesGuard → PolicyGuard (CASL abilities)</text>
  <text x="440" y="474" text-anchor="middle" class="bsmall">school → academic_year → term → course_section → student scope</text>

  <g font-size="11">
    <rect x="104" y="492" width="105" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="156" y="511" text-anchor="middle" class="btext">identity</text>
    <rect x="217" y="492" width="105" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="269" y="511" text-anchor="middle" class="btext">directory</text>
    <rect x="330" y="492" width="105" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="382" y="511" text-anchor="middle" class="btext">academics</text>
    <rect x="443" y="492" width="105" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="495" y="511" text-anchor="middle" class="btext">gradebook</text>
    <rect x="556" y="492" width="105" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="608" y="511" text-anchor="middle" class="btext">attendance</text>
    <rect x="669" y="492" width="107" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="722" y="511" text-anchor="middle" class="btext">assignments</text>

    <rect x="104" y="528" width="105" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="156" y="547" text-anchor="middle" class="btext">calendar</text>
    <rect x="217" y="528" width="105" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="269" y="547" text-anchor="middle" class="btext">messaging</text>
    <rect x="330" y="528" width="105" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="382" y="547" text-anchor="middle" class="btext">notifications</text>
    <rect x="443" y="528" width="105" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="495" y="547" text-anchor="middle" class="btext">reporting</text>
    <rect x="556" y="528" width="105" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="608" y="547" text-anchor="middle" class="btext">admin</text>
    <rect x="669" y="528" width="107" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="722" y="547" text-anchor="middle" class="btext">compliance</text>
  </g>
  <rect x="104" y="566" width="672" height="26" rx="6" fill="#fef2f2" stroke="#dc2626" class="box"/>
  <text x="440" y="583" text-anchor="middle" class="bsmall" fill="#991b1b" font-weight="700">every transaction: SET LOCAL app.user_id · app.role · app.school_id</text>

  <!-- IDENTITY -->
  <rect x="832" y="406" width="368" height="196" rx="12" class="layer"/>
  <text x="856" y="430" class="lbl">IDENTITY</text>
  <rect x="856" y="442" width="320" height="34" rx="8" fill="#ffffff" stroke="#0f766e" class="box"/>
  <text x="1016" y="464" text-anchor="middle" class="btext">Microsoft Entra ID (staff + students)</text>
  <rect x="856" y="482" width="320" height="34" rx="8" fill="#ffffff" stroke="#0f766e" class="box"/>
  <text x="1016" y="504" text-anchor="middle" class="btext">Google Workspace (staff + students)</text>
  <rect x="856" y="522" width="320" height="34" rx="8" fill="#ffffff" stroke="#0f766e" class="box"/>
  <text x="1016" y="544" text-anchor="middle" class="btext">Local: email + passkey (parents)</text>
  <text x="1016" y="580" text-anchor="middle" class="bsmall">Auth0 / Clerk / Keycloak · OIDC Auth Code + PKCE</text>
  <text x="1016" y="594" text-anchor="middle" class="bsmall">MFA: TOTP + WebAuthn · no JIT staff accounts</text>

  <path d="M 832 470 L 806 470" class="edgeb" marker-end="url(#arrowBlue)"/>

  <!-- DATA -->
  <path d="M 260 602 L 260 636" class="edge" marker-end="url(#arrow)"/>
  <path d="M 520 602 L 520 636" class="edge" marker-end="url(#arrow)"/>
  <path d="M 700 602 L 700 636" class="edge" marker-end="url(#arrow)"/>
  <path d="M 1016 602 L 1016 636" class="edgeb" marker-end="url(#arrowBlue)"/>

  <text x="80" y="630" class="lbl">DATA &amp; STATE</text>

  <rect x="80" y="640" width="260" height="118" rx="12" fill="#eff6ff" stroke="#2563eb" class="box"/>
  <text x="210" y="666" text-anchor="middle" class="btitle">PostgreSQL 18</text>
  <text x="210" y="684" text-anchor="middle" class="bsmall">system of record · Multi-AZ</text>
  <text x="210" y="702" text-anchor="middle" class="bsmall">GATE 2 — Row-Level Security</text>
  <text x="210" y="720" text-anchor="middle" class="bsmall">AES-256-GCM PII columns</text>
  <text x="210" y="738" text-anchor="middle" class="bsmall">+ HMAC blind indexes</text>
  <text x="210" y="754" text-anchor="middle" class="bsmall">read replica · PITR · 7-yr archive</text>

  <rect x="360" y="640" width="260" height="118" rx="12" fill="#fefce8" stroke="#ca8a04" class="box"/>
  <text x="490" y="666" text-anchor="middle" class="btitle">Redis 7 / Valkey</text>
  <text x="490" y="684" text-anchor="middle" class="bsmall">opaque session store</text>
  <text x="490" y="702" text-anchor="middle" class="bsmall">permission cache</text>
  <text x="490" y="720" text-anchor="middle" class="bsmall">rate-limit counters</text>
  <text x="490" y="738" text-anchor="middle" class="bsmall">BullMQ queues</text>
  <text x="490" y="754" text-anchor="middle" class="bsmall">Socket.IO adapter</text>

  <rect x="640" y="640" width="260" height="118" rx="12" fill="#f0fdf4" stroke="#16a34a" class="box"/>
  <text x="770" y="666" text-anchor="middle" class="btitle">S3 / Cloudflare R2</text>
  <text x="770" y="684" text-anchor="middle" class="bsmall">submissions · materials</text>
  <text x="770" y="702" text-anchor="middle" class="bsmall">record exports</text>
  <text x="770" y="720" text-anchor="middle" class="bsmall">SSE-KMS at rest</text>
  <text x="770" y="738" text-anchor="middle" class="bsmall">presigned URLs only</text>
  <text x="770" y="754" text-anchor="middle" class="bsmall">no public buckets</text>

  <rect x="920" y="640" width="280" height="118" rx="12" fill="#faf5ff" stroke="#9333ea" class="box"/>
  <text x="1060" y="666" text-anchor="middle" class="btitle">Socket.IO gateway</text>
  <text x="1060" y="684" text-anchor="middle" class="bsmall">self-hosted in VPC</text>
  <text x="1060" y="702" text-anchor="middle" class="bsmall">message bodies stay in Postgres</text>
  <text x="1060" y="720" text-anchor="middle" class="bsmall">no third-party PII processor</text>
  <text x="1060" y="738" text-anchor="middle" class="bsmall">grade-change + chat events</text>
  <text x="1060" y="754" text-anchor="middle" class="bsmall">Redis adapter for scale-out</text>

  <!-- WORKERS -->
  <path d="M 400 758 L 400 792" class="edge" marker-end="url(#arrow)"/>
  <text x="80" y="786" class="lbl">ASYNC</text>

  <rect x="80" y="796" width="560" height="96" rx="12" fill="#fff7ed" stroke="#ea580c" class="box"/>
  <text x="360" y="820" text-anchor="middle" class="btitle">Workers — BullMQ consumers (separate deployable)</text>
  <text x="360" y="840" text-anchor="middle" class="bsmall">notification fan-out (email + push) · absence &amp; missing-work digests</text>
  <text x="360" y="856" text-anchor="middle" class="bsmall">report-card snapshot generation · roster CSV import</text>
  <text x="360" y="872" text-anchor="middle" class="bsmall">key rotation · retention &amp; archival · virus scan (ClamAV)</text>

  <rect x="672" y="796" width="240" height="96" rx="12" fill="#ffffff" stroke="#cbd5e1" class="box"/>
  <text x="792" y="822" text-anchor="middle" class="btitle">Email</text>
  <text x="792" y="842" text-anchor="middle" class="bsmall">Amazon SES / Postmark</text>
  <text x="792" y="858" text-anchor="middle" class="bsmall">SPF · DKIM · DMARC</text>
  <text x="792" y="874" text-anchor="middle" class="bsmall">suppression list</text>

  <rect x="936" y="796" width="264" height="96" rx="12" fill="#ffffff" stroke="#cbd5e1" class="box"/>
  <text x="1068" y="822" text-anchor="middle" class="btitle">Push</text>
  <text x="1068" y="842" text-anchor="middle" class="bsmall">Web Push (VAPID) · FCM</text>
  <text x="1068" y="858" text-anchor="middle" class="bsmall">PWA install required on iOS</text>
  <text x="1068" y="874" text-anchor="middle" class="bsmall">per-role topic subscriptions</text>

  <!-- PLATFORM -->
  <rect x="80" y="918" width="1120" height="96" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="104" y="942" class="lbl">PLATFORM</text>
  <text x="104" y="964" class="btext">Terraform (S3 + DynamoDB state) · GitHub Actions CI/CD · blue/green on ECS Fargate · Docker multi-arch distroless</text>
  <text x="104" y="984" class="btext">AWS KMS + Secrets Manager · OpenTelemetry traces · Sentry · SLO alerts · k6 load tests in CI</text>
  <text x="104" y="1004" class="btext">Environments: dev → staging (synthetic data only) → prod · append-only hash-chained audit_log · quarterly restore rehearsal</text>

  <text x="640" y="1050" text-anchor="middle" class="sub">Compliance envelope: FERPA (34 CFR pt. 99) · COPPA under-13 gate · WCAG 2.2 AA · Nigeria NDPA 2023 + GAID 2025 where applicable</text>
</svg>
